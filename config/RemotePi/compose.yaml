# Paseo가 쓰는 Caddy만 남깁니다. 기존 인증서·network 이름을 보존합니다.
name: llm-home-server-remote-pi

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      REMOTE_PI_DDNS_HOSTNAME: ${REMOTE_PI_DDNS_HOSTNAME:?DDNS hostname is required}
      REMOTE_PI_ACME_DIRECTORY: ${REMOTE_PI_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "443:443/tcp"
      - "8789:443/tcp"
    networks:
      relay-internal: {}
      caddy-egress:
        gw_priority: 1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  relay-internal:
    internal: true
  caddy-egress: {}

volumes:
  caddy-data:
    name: llm-home-server-remote-pi-caddy-${REMOTE_PI_CERTIFICATE_ENVIRONMENT:-production}
  caddy-config: {}
