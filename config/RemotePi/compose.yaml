name: llm-home-server-remote-pi

services:
  relay:
    image: jacobmoura7/remote-pi-relay@sha256:fdc9aa78918d881a10b806473e654f5e0e5aaa3139868023d1c79058ca71fa78
    restart: unless-stopped
    environment:
      REMOTEPI_RELAY_PORT: "3000"
      REMOTEPI_MESH_DB_PATH: /data/mesh.db
      RUST_LOG: info
    expose:
      - "3000"
    networks:
      - relay-internal
    volumes:
      - relay-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      REMOTE_PI_DDNS_HOSTNAME: ${REMOTE_PI_DDNS_HOSTNAME:?DDNS hostname is required}
      REMOTE_PI_ACME_DIRECTORY: ${REMOTE_PI_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "443:443/tcp"
      - "8789:443/tcp"
    networks:
      relay-internal: {}
      caddy-egress:
        gw_priority: 1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  relay-internal:
    internal: true
  caddy-egress: {}

volumes:
  relay-data: {}
  caddy-data:
    name: llm-home-server-remote-pi-caddy-${REMOTE_PI_CERTIFICATE_ENVIRONMENT:-production}
  caddy-config: {}
